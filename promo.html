<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MundoStreamer — Professional FPV Ground Station
  <meta name="description" content="The ultimate FPV ground station solution. Crystal-clear 1080p@60fps recording, ultra-low latency streaming, direct HDMI 60Hz display, and professional DVR — powered by Radxa ROCK 3A or Raspberry Pi 4B (Rockchip RK3568).">
  <style>
    :root {
      --bg-base: #06090e;
      --bg-card: rgba(13, 20, 32, 0.88);
      --bg-card2: rgba(8, 14, 26, 0.92);
      --border-card: rgba(0, 240, 255, 0.18);
      --cyan: #00f0ff;
      --magenta: #ff007f;
      --green: #00ff9d;
      --amber: #ffb800;
      --purple: #a855f7;
      --text-main: #e6f1ff;
      --text-muted: #7b90aa;
      --text-dim: #4a5f75;
      --transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.4);
      --glow-magenta: 0 0 20px rgba(255, 0, 127, 0.4);
      --glow-green: 0 0 20px rgba(0, 255, 157, 0.4);
    }
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
    }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ──────────── ANIMATED BACKGROUND ──────────── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: -3; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 20% 20%, rgba(0,240,255,0.07) 0%, transparent 55%),
                  radial-gradient(ellipse 70% 50% at 80% 80%, rgba(255,0,127,0.07) 0%, transparent 55%),
                  radial-gradient(ellipse 50% 40% at 50% 50%, rgba(168,85,247,0.04) 0%, transparent 60%);
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background-image:
        linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .bg-grid::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, var(--bg-base) 0%, transparent 10%, transparent 90%, var(--bg-base) 100%);
    }

    /* ──────────── NAV ──────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: rgba(6, 9, 14, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.14);
      padding: 14px 32px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: inherit;
    }
    .nav-logo {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1.5px solid var(--cyan);
      box-shadow: var(--glow-cyan);
      object-fit: contain;
      background: rgba(6,9,14,0.7);
    }
    .nav-logo-fallback {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: 1.5px solid var(--cyan);
      box-shadow: var(--glow-cyan);
      background: linear-gradient(135deg, #00f0ff22, #ff007f22);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
    }
    .nav-wordmark {
      font-size: 1.1rem; font-weight: 900;
      letter-spacing: 2px; text-transform: uppercase;
      background: linear-gradient(90deg, #00f0ff, #fff 50%, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-tagline {
      font-size: 0.65rem; color: var(--text-muted);
      letter-spacing: 0.5px; margin-top: 1px;
    }
    .nav-links {
      display: flex; align-items: center; gap: 28px;
      list-style: none;
    }
    .nav-links a {
      color: var(--text-muted); text-decoration: none;
      font-size: 0.85rem; font-weight: 500;
      letter-spacing: 0.3px;
      transition: var(--transition);
    }
    .nav-links a:hover { color: var(--cyan); }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 20px; border-radius: 8px;
      background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(255,0,127,0.10));
      border: 1px solid rgba(0,240,255,0.35);
      color: var(--cyan) !important;
      font-weight: 700 !important;
      font-size: 0.82rem !important;
      letter-spacing: 0.5px;
      transition: var(--transition);
    }
    .nav-cta:hover {
      background: linear-gradient(135deg, rgba(0,240,255,0.25), rgba(255,0,127,0.18)) !important;
      box-shadow: var(--glow-cyan);
      transform: translateY(-1px);
    }
    @media (max-width: 680px) {
      .nav-links { display: none; }
      nav { padding: 12px 18px; }
    }

    /* ──────────── HERO ──────────── */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
    }
    .hero-logo-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: fadeUp 0.6s ease both;
    }
    .hero-logo-img {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 35px rgba(0,240,255,0.45), 0 0 70px rgba(255,0,127,0.25);
      background: rgba(6, 9, 14, 0.9);
      object-fit: contain;
      padding: 6px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .hero-logo-img:hover {
      transform: scale(1.06) rotate(-1deg);
      box-shadow: 0 0 50px rgba(0,240,255,0.7), 0 0 90px rgba(255,0,127,0.4);
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 16px; border-radius: 30px;
      font-size: 0.74rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.28);
      margin-bottom: 24px;
      animation: fadeUp 0.6s ease both;
    }
    .hero-badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.5s infinite;
    }
    .hero h1 {
      font-size: clamp(2.6rem, 7vw, 5rem);
      font-weight: 900; line-height: 1.1;
      letter-spacing: -1px;
      animation: fadeUp 0.7s 0.1s ease both;
    }
    .hero h1 .line-cyan {
      background: linear-gradient(90deg, #00f0ff, #a0f8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero h1 .line-white { color: #fff; }
    .hero h1 .line-magenta {
      background: linear-gradient(90deg, #ff007f, #ff66aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-sub {
      max-width: 600px;
      font-size: clamp(1rem, 2.5vw, 1.22rem);
      color: var(--text-muted); line-height: 1.7;
      margin: 24px auto 40px;
      animation: fadeUp 0.7s 0.2s ease both;
    }
    .hero-actions {
      display: flex; flex-wrap: wrap; gap: 14px;
      justify-content: center;
      animation: fadeUp 0.7s 0.3s ease both;
    }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 32px; border-radius: 12px;
      font-size: 1rem; font-weight: 800; letter-spacing: 0.5px;
      text-decoration: none;
      background: linear-gradient(135deg, #00f0ff, #00aacc);
      color: #020811;
      border: none; cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 24px rgba(0,240,255,0.35);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 40px rgba(0,240,255,0.55);
    }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 32px; border-radius: 12px;
      font-size: 1rem; font-weight: 700;
      text-decoration: none; color: var(--text-main);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      transition: var(--transition);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(0,240,255,0.35);
      transform: translateY(-3px);
    }

    /* ──────────── STAT STRIP ──────────── */
    .stats-strip {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
      margin-top: 60px;
      animation: fadeUp 0.7s 0.4s ease both;
    }
    .stat-chip {
      display: flex; flex-direction: column; align-items: center;
      padding: 18px 28px; border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      min-width: 120px;
      transition: var(--transition);
    }
    .stat-chip:hover {
      border-color: rgba(0,240,255,0.4);
      transform: translateY(-3px);
      box-shadow: var(--glow-cyan);
    }
    .stat-num {
      font-size: 1.7rem; font-weight: 900;
      background: linear-gradient(135deg, var(--cyan), var(--green));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .stat-label { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.5px; }

    /* ──────────── SECTION COMMON ──────────── */
    section {
      padding: 100px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .section-badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 4px 14px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .badge-cyan { color: var(--cyan); background: rgba(0,240,255,0.08); border: 1px solid rgba(0,240,255,0.25); }
    .badge-magenta { color: var(--magenta); background: rgba(255,0,127,0.08); border: 1px solid rgba(255,0,127,0.25); }
    .badge-green { color: var(--green); background: rgba(0,255,157,0.08); border: 1px solid rgba(0,255,157,0.25); }
    .badge-purple { color: var(--purple); background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.25); }
    .badge-amber { color: var(--amber); background: rgba(255,184,0,0.08); border: 1px solid rgba(255,184,0,0.25); }

    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 900; line-height: 1.2; letter-spacing: -0.5px;
      margin-bottom: 16px;
    }
    .section-title em { font-style: normal; }
    .section-desc {
      font-size: 1.05rem; color: var(--text-muted); line-height: 1.7;
      max-width: 560px; margin-bottom: 48px;
    }

    /* ──────────── FEATURES GRID ──────────── */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .feat-card {
      position: relative; overflow: hidden;
      padding: 28px; border-radius: 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      transition: var(--transition);
    }
    .feat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      opacity: 0; transition: var(--transition);
    }
    .feat-card:hover { transform: translateY(-5px); }
    .feat-card.cyan:hover { border-color: rgba(0,240,255,0.45); box-shadow: 0 8px 40px rgba(0,240,255,0.12); }
    .feat-card.cyan::before { background: linear-gradient(90deg, var(--cyan), transparent); }
    .feat-card.cyan:hover::before { opacity: 1; }
    .feat-card.magenta:hover { border-color: rgba(255,0,127,0.45); box-shadow: 0 8px 40px rgba(255,0,127,0.12); }
    .feat-card.magenta::before { background: linear-gradient(90deg, var(--magenta), transparent); }
    .feat-card.magenta:hover::before { opacity: 1; }
    .feat-card.green:hover { border-color: rgba(0,255,157,0.45); box-shadow: 0 8px 40px rgba(0,255,157,0.12); }
    .feat-card.green::before { background: linear-gradient(90deg, var(--green), transparent); }
    .feat-card.green:hover::before { opacity: 1; }
    .feat-card.amber:hover { border-color: rgba(255,184,0,0.45); box-shadow: 0 8px 40px rgba(255,184,0,0.12); }
    .feat-card.amber::before { background: linear-gradient(90deg, var(--amber), transparent); }
    .feat-card.amber:hover::before { opacity: 1; }
    .feat-card.purple:hover { border-color: rgba(168,85,247,0.45); box-shadow: 0 8px 40px rgba(168,85,247,0.12); }
    .feat-card.purple::before { background: linear-gradient(90deg, var(--purple), transparent); }
    .feat-card.purple:hover::before { opacity: 1; }

    .feat-icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; margin-bottom: 18px;
    }
    .icon-cyan { background: rgba(0,240,255,0.12); border: 1px solid rgba(0,240,255,0.25); }
    .icon-magenta { background: rgba(255,0,127,0.12); border: 1px solid rgba(255,0,127,0.25); }
    .icon-green { background: rgba(0,255,157,0.12); border: 1px solid rgba(0,255,157,0.25); }
    .icon-amber { background: rgba(255,184,0,0.12); border: 1px solid rgba(255,184,0,0.25); }
    .icon-purple { background: rgba(168,85,247,0.12); border: 1px solid rgba(168,85,247,0.25); }

    .feat-title {
      font-size: 1.08rem; font-weight: 800; margin-bottom: 10px;
    }
    .feat-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.65; }
    .feat-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .feat-tag {
      padding: 3px 10px; border-radius: 6px;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.3px;
    }
    .tag-cyan { background: rgba(0,240,255,0.1); color: var(--cyan); border: 1px solid rgba(0,240,255,0.2); }
    .tag-green { background: rgba(0,255,157,0.1); color: var(--green); border: 1px solid rgba(0,255,157,0.2); }
    .tag-magenta { background: rgba(255,0,127,0.1); color: var(--magenta); border: 1px solid rgba(255,0,127,0.2); }
    .tag-amber { background: rgba(255,184,0,0.1); color: var(--amber); border: 1px solid rgba(255,184,0,0.2); }
    .tag-purple { background: rgba(168,85,247,0.1); color: var(--purple); border: 1px solid rgba(168,85,247,0.2); }

    /* ──────────── PROTOCOL SHOWCASE ──────────── */
    .protocol-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .proto-card {
      padding: 22px 18px; border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      text-align: center;
      transition: var(--transition);
    }
    .proto-card:hover {
      border-color: rgba(0,240,255,0.4);
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,240,255,0.10);
    }
    .proto-icon { font-size: 2rem; margin-bottom: 10px; }
    .proto-name {
      font-size: 0.9rem; font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .proto-desc { font-size: 0.76rem; color: var(--text-muted); margin-top: 5px; }

    /* ──────────── DUAL-COL LAYOUT ──────────── */
    .dual-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px; align-items: center;
    }
    @media (max-width: 760px) { .dual-col { grid-template-columns: 1fr; gap: 40px; } }
    .dual-col.reverse { direction: rtl; }
    .dual-col.reverse > * { direction: ltr; }

    .demo-screen {
      border-radius: 18px;
      background: var(--bg-card2);
      border: 1px solid rgba(0,240,255,0.2);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 60px rgba(0,240,255,0.07);
    }
    .demo-bar {
      background: rgba(6,9,14,0.95);
      border-bottom: 1px solid rgba(0,240,255,0.14);
      padding: 10px 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .demo-dot { width: 10px; height: 10px; border-radius: 50%; }
    .demo-title {
      font-size: 0.72rem; color: var(--text-muted);
      letter-spacing: 0.5px; margin-left: 4px;
      font-weight: 600;
    }
    .demo-body { padding: 20px; }

    /* ──────────── LIVE VIDEO MOCKUP ──────────── */
    .video-mock {
      aspect-ratio: 16/9;
      background: linear-gradient(160deg, #0a1420 0%, #050b14 100%);
      border-radius: 14px; overflow: hidden;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(0,240,255,0.15);
    }
    .video-mock-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,240,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,0.04) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    .video-mock-content {
      position: relative; z-index: 1;
      text-align: center;
    }
    .video-drone { font-size: 3.5rem; filter: drop-shadow(0 0 20px rgba(0,240,255,0.6)); animation: float 3s ease-in-out infinite; }
    .video-fps-badge {
      display: inline-block; margin-top: 12px;
      padding: 4px 12px; border-radius: 6px;
      font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
      background: rgba(0,240,255,0.15); color: var(--cyan);
      border: 1px solid rgba(0,240,255,0.3);
    }
    .video-overlay-hud {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .hud-item {
      padding: 4px 10px; border-radius: 6px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.5px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
    }
    .hud-live { color: var(--magenta); border: 1px solid rgba(255,0,127,0.3); }
    .hud-res { color: var(--green); border: 1px solid rgba(0,255,157,0.3); }
    .hud-fps { color: var(--cyan); border: 1px solid rgba(0,240,255,0.3); }
    .hud-rec {
      position: absolute; bottom: 10px; left: 10px;
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 6px;
      font-size: 0.68rem; font-weight: 700;
      background: rgba(255,0,0,0.2); color: #ff4444;
      border: 1px solid rgba(255,0,0,0.35);
    }
    .hud-rec-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff4444; animation: pulse 1s infinite; }

    /* ──────────── CHECKLIST ──────────── */
    .checklist { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .checklist li {
      display: flex; align-items: flex-start; gap: 12px;
      font-size: 0.95rem; line-height: 1.5; color: var(--text-muted);
    }
    .check-icon {
      width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; margin-top: 1px;
    }
    .ci-cyan { background: rgba(0,240,255,0.15); color: var(--cyan); }
    .ci-green { background: rgba(0,255,157,0.15); color: var(--green); }
    .ci-magenta { background: rgba(255,0,127,0.15); color: var(--magenta); }
    .ci-amber { background: rgba(255,184,0,0.15); color: var(--amber); }

    /* ──────────── TERMINAL MOCK ──────────── */
    .terminal {
      border-radius: 14px; overflow: hidden;
      background: rgba(4, 8, 16, 0.95);
      border: 1px solid rgba(0,240,255,0.18);
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .terminal-bar {
      background: rgba(10,16,28,0.95);
      border-bottom: 1px solid rgba(0,240,255,0.12);
      padding: 10px 14px;
      display: flex; align-items: center; gap: 7px;
    }
    .terminal-body { padding: 18px 20px; }
    .t-line { font-size: 0.82rem; line-height: 1.9; }
    .t-prompt { color: var(--green); }
    .t-cmd { color: var(--text-main); }
    .t-out { color: var(--text-muted); }
    .t-val-cyan { color: var(--cyan); }
    .t-val-green { color: var(--green); }
    .t-val-magenta { color: var(--magenta); }
    .t-val-amber { color: var(--amber); }
    .t-cursor {
      display: inline-block; width: 8px; height: 14px;
      background: var(--cyan); vertical-align: middle;
      animation: blink 1.1s step-end infinite;
    }

    /* ──────────── STREAM PROTOCOLS ──────────── */
    .proto-showcase {
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .proto-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 30px;
      font-size: 0.82rem; font-weight: 700;
      border: 1px solid;
      transition: var(--transition);
    }
    .proto-pill:hover { transform: translateY(-2px); }

<script>
  // Scroll reveal
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  revealEls.forEach(el => io.observe(el));

  // Smooth scroll for nav links
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const href = a.getAttribute('href');
      if (href === '#' || href === '') {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      const target = document.querySelector(href);
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  // Animated counter for stats
  function animateCount(el, target, suffix='', duration=1200) {
    const start = performance.now();
    const update = now => {
      const progress = Math.min((now - start) / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      el.textContent = (typeof target === 'number' ? Math.round(target * ease) : target) + suffix;
      if (progress < 1) requestAnimationFrame(update);
    };
    requestAnimationFrame(update);
  }

  // Animate stat numbers when visible
  const statNums = document.querySelectorAll('.stat-num');
  const statIo = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        statIo.unobserve(e.target);
      }
    });
  }, { threshold: 0.5 });
  statNums.forEach(el => statIo.observe(el));
</script>
